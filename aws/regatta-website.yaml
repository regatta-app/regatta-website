AWSTemplateFormatVersion: "2010-09-09"
Description: >
  regatta.tech marketing site: private S3 bucket served through CloudFront with
  an ACM certificate for regatta.tech and www.regatta.tech, plus a small
  receiver for the "Request a pilot" form (Lambda -> SNS email).
  CREATE THIS STACK IN US EAST (N. VIRGINIA) us-east-1: CloudFront only accepts
  certificates from that region. DNS records are switched by hand in Route 53
  afterwards (see the guide), so the move from Netlify is instant and reversible.

Parameters:
  DomainName:
    Type: String
    Default: regatta.tech
    Description: Apex domain of the site (no www).
  HostedZoneId:
    Type: AWS::Route53::HostedZoneId
    Description: The Route 53 hosted zone for the domain (used to validate the certificate automatically).
  PilotNotifyEmail1:
    Type: String
    Description: Email that receives each "Request a pilot" submission. AWS sends a confirmation email; click its link once.
  PilotNotifyEmail2:
    Type: String
    Default: ""
    Description: Optional second recipient. Leave empty for none.

Conditions:
  HasSecondEmail: !Not [!Equals [!Ref PilotNotifyEmail2, ""]]

Resources:

  # ---------- Site files ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- Certificate (validated through Route 53) ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  # ---------- "Request a pilot" form receiver ----------
  PilotTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-pilot-requests"
      DisplayName: Regatta pilot requests

  PilotSubscription1:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PilotTopic
      Protocol: email
      Endpoint: !Ref PilotNotifyEmail1

  PilotSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasSecondEmail
    Properties:
      TopicArn: !Ref PilotTopic
      Protocol: email
      Endpoint: !Ref PilotNotifyEmail2

  PilotFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: publish-pilot-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref PilotTopic

  PilotFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-pilot-form"
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt PilotFunctionRole.Arn
      Environment:
        Variables:
          TOPIC_ARN: !Ref PilotTopic
          SITE_URL: !Sub "https://${DomainName}"
      Code:
        ZipFile: |
          const { SNSClient, PublishCommand } = require("@aws-sdk/client-sns");
          const sns = new SNSClient({});
          const SITE = process.env.SITE_URL;

          function redirect(path) {
            return { statusCode: 303, headers: { Location: SITE + path, "Cache-Control": "no-store" }, body: "" };
          }

          exports.handler = async (event) => {
            const method = (event.requestContext && event.requestContext.http && event.requestContext.http.method) || "GET";
            if (method !== "POST") return redirect("/home/");

            let raw = event.body || "";
            if (event.isBase64Encoded) raw = Buffer.from(raw, "base64").toString("utf8");
            const fields = Object.fromEntries(new URLSearchParams(raw));

            // Honeypot filled in -> a bot. Pretend it worked.
            if (fields["bot-field"]) return redirect("/thanks/");

            const email = (fields.email || "").trim().slice(0, 200);
            const org = (fields.organization || "").trim().slice(0, 200);
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return redirect("/home/#pilot");

            const when = new Date().toISOString().replace("T", " ").slice(0, 16) + " UTC";
            const ip = (event.requestContext && event.requestContext.http && event.requestContext.http.sourceIp) || "";
            const ua = (event.headers && event.headers["user-agent"]) || "";
            const text =
              "New pilot request from regatta.tech\n\n" +
              "Email:        " + email + "\n" +
              "Organization: " + org + "\n" +
              "Received:     " + when + "\n" +
              "IP:           " + ip + "\n" +
              "Browser:      " + ua + "\n";

            await sns.send(new PublishCommand({
              TopicArn: process.env.TOPIC_ARN,
              Subject: ("Pilot request: " + org + " (" + email + ")").slice(0, 99),
              Message: text,
            }));
            return redirect("/thanks/");
          };

  PilotFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt PilotFunction.Arn
      AuthType: NONE

  PilotFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PilotFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ---------- URL tidy-up: www -> apex, pretty URLs ----------
  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-urls"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the apex domain and map folder/pretty URLs to their html file.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host.indexOf('www.') === 0) {
            var qs = '';
            var keys = Object.keys(request.querystring);
            if (keys.length) {
              qs = '?' + keys.map(function (k) {
                return k + '=' + encodeURIComponent(request.querystring[k].value);
              }).join('&');
            }
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://' + host.slice(4) + request.uri + qs } }
            };
          }
          var uri = request.uri;
          if (uri.indexOf('/api/') === 0) return request;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = uri + '.html';
          }
          return request;
        }

  # ---------- CDN ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${DomainName} marketing site"
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: pilot-form
            DomainName: !Select [2, !Split ["/", !GetAtt PilotFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fbf-a2b2-7b09c93d88dd   # managed: CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: pilot-form
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # managed: CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # managed: AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

Outputs:
  BucketName:
    Description: Upload the site files here (index.html at the top level).
    Value: !Ref SiteBucket
  DistributionId:
    Description: Needed to clear the cache after uploading a new version.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point regatta.tech and www.regatta.tech at this name in Route 53 (A and AAAA alias records).
    Value: !GetAtt Distribution.DomainName
  TestUrl:
    Description: Try the site here before changing DNS.
    Value: !Sub "https://${Distribution.DomainName}"
  PilotFormEndpoint:
    Description: Where the "Request a pilot" form posts (through CloudFront).
    Value: !Sub "https://${DomainName}/api/pilot"
